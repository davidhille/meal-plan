# Hält zwei Confluence-Seiten (Funktionen, Änderungshistorie) mit dem Repo aktuell.
# Braucht die Secrets CONFLUENCE_EMAIL und CONFLUENCE_API_TOKEN; fehlen sie, passiert nichts (siehe SETUP_NEON_CLOUDFLARE.md).
name: Confluence abgleichen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: confluence
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Seiten abgleichen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Seiten aktualisieren
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/confluence/sync.ts
