# Prüft jeden Pull Request (und main), bevor Cloudflare deployt.
# Cloudflare selbst baut nur mit `vite build` – das prüft keine Typen und kein Lint.
# Schlägt eine Prüfung fehl, stehen die Meldungen zusätzlich als Kommentar im Pull Request.
name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Typen, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Pakete installieren
        run: bun install --frozen-lockfile

      - name: Typen prüfen (Frontend)
        id: tsc_app
        run: bunx tsc --noEmit -p tsconfig.app.json --pretty false 2>&1 | tee tsc-app.log; exit ${PIPESTATUS[0]}

      - name: Typen prüfen (Worker)
        id: tsc_worker
        if: ${{ !cancelled() }}
        run: bunx tsc -p worker --pretty false 2>&1 | tee tsc-worker.log; exit ${PIPESTATUS[0]}

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        run: bun run lint 2>&1 | tee lint.log; exit ${PIPESTATUS[0]}

      - name: Tests
        if: ${{ !cancelled() }}
        run: bun test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Build
        if: ${{ !cancelled() }}
        run: bun run build

      - name: Fehler in den Pull Request schreiben
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ Prüfung fehlgeschlagen"
            for f in tsc-app.log tsc-worker.log lint.log test.log; do
              if [ -s "$f" ] && grep -qE "error|✖" "$f"; then
                echo ""
                echo "<details open><summary><code>$f</code></summary>"
                echo ""
                echo '```'
                grep -E "^/|error|✖|\(fail\)|Expected|Received" "$f" | sed "s#$GITHUB_WORKSPACE/##" | head -200
                echo '```'
                echo "</details>"
              fi
            done
          } > kommentar.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file kommentar.md
