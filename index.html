<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Direkt nach einem Deploy kann eine neue Datei kurz fehlen: dann einmal neu laden statt leerer/ungestalteter Seite -->
    <script>
      addEventListener('error', function (e) {
        var t = e.target, u = t && (t.src || t.href);
        if (!u || String(u).indexOf(location.origin + '/assets/') !== 0) return;
        try {
          // höchstens einmal pro Minute, damit es keine Endlosschleife gibt
          if (Date.now() - Number(sessionStorage.getItem('asset-retry') || 0) < 60000) return;
          sessionStorage.setItem('asset-retry', String(Date.now()));
        } catch (_) { return; }
        setTimeout(function () { location.reload(); }, 1500);
      }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>miyummy – Familien-Speiseplaner</title>
    <meta name="description" content="Speiseplan, Rezepte und Einkaufsliste für die Familie" />
    <link rel="icon" href="/icons/icon.svg?v=2" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FAF7FA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <!-- Logo „miyummy“: Poppins nur für die Zeichen m, ı, y, u -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;800&text=m%C4%B1yu&display=swap" />
    <!-- iPhone: „Zum Home-Bildschirm“ öffnet die App im Vollbild -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="miyummy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
